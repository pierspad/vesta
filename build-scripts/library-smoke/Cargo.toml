[package]
name = "vesta-library-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
vesta-parser = { path = "../../core/vesta-parser" }
vesta-apkg = { path = "../../core/vesta-apkg" }
vesta-download = { path = "../../core/vesta-download" }
vesta-ankiconnect = { path = "../../lib/vesta-ankiconnect" }
vesta-autosync = { path = "../../lib/vesta-autosync" }
vesta-extract = { path = "../../lib/vesta-extract" }
vesta-flashcards = { path = "../../lib/vesta-flashcards" }
vesta-ocr = { path = "../../lib/vesta-ocr" }
vesta-refine = { path = "../../lib/vesta-refine" }
vesta-sync = { path = "../../lib/vesta-sync" }
vesta-transcribe = { path = "../../lib/vesta-transcribe" }
vesta-translate = { path = "../../lib/vesta-translate" }

[patch.crates-io]
# Workspace patches do not flow into downstream projects. This patch is needed
# to reproduce Vesta's supported whisper-rs-sys build configuration.
whisper-rs-sys = { path = "../../vendor/whisper-rs-sys-0.15.0" }
