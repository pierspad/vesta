[package]
name = "vesta-mcp"
version = "0.29.1"
edition.workspace = true
rust-version.workspace = true
description = "Local MCP server for Vesta subtitle inspection and flashcard generation"
license = "GPL-3.0-only"
repository = "https://github.com/pierspad/vesta"

[dependencies]
anyhow.workspace = true
reqwest.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true
srt-flashcards.workspace = true
srt-parser.workspace = true
srt-translate.workspace = true
srt-transcribe.workspace = true
tokio-util = "0.7"
rmcp = { version = "3.6", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"

[dev-dependencies]
rmcp = { version = "3.6", default-features = false, features = ["client", "transport-child-process"] }

[features]
vulkan = ["srt-transcribe/vulkan"]
cuda = ["srt-transcribe/cuda"]
rocm = ["srt-transcribe/rocm"]
sycl = ["srt-transcribe/sycl"]
