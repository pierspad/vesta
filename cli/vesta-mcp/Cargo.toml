[package]
name = "vesta-mcp"
version = "0.35.0-dev.2"
edition.workspace = true
rust-version.workspace = true
description = "Local MCP server for Vesta subtitle inspection, flashcard generation, translation and transcription"
license = "GPL-3.0-only"
repository = "https://github.com/pierspad/vesta"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
reqwest.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true
vesta-extract.workspace = true
vesta-flashcards.workspace = true
vesta-ocr.workspace = true
vesta-parser.workspace = true
vesta-translate.workspace = true
vesta-transcribe.workspace = true
tokio-util = "0.7"
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"

[dev-dependencies]
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process"] }

[features]
vulkan = ["vesta-transcribe/vulkan"]
cuda = ["vesta-transcribe/cuda"]
rocm = ["vesta-transcribe/rocm"]
sycl = ["vesta-transcribe/sycl"]
