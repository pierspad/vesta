[package]
name = "vesta-cli"
version = "1.1.0-dev.1"
edition.workspace = true
rust-version.workspace = true
description = "Unified headless command-line interface for Vesta library workflows"
license = "GPL-3.0-only"
repository = "https://github.com/pierspad/vesta"

[[bin]]
name = "vesta-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
vesta-autosync-cli = { path = "../vesta-autosync-cli" }
vesta-extract-cli = { path = "../vesta-extract-cli" }
vesta-flashcards-cli = { path = "../vesta-flashcards-cli" }
vesta-ocr-cli = { path = "../vesta-ocr-cli" }
vesta-refine-cli = { path = "../vesta-refine-cli" }
vesta-sync-cli = { path = "../vesta-sync-cli" }
vesta-transcribe-cli = { path = "../vesta-transcribe-cli" }
vesta-translate-cli = { path = "../vesta-translate-cli" }
vesta-mcp = { path = "../vesta-mcp" }

[dev-dependencies]
tempfile.workspace = true

[features]
vulkan = ["vesta-transcribe-cli/vulkan", "vesta-mcp/vulkan"]
cuda = ["vesta-transcribe-cli/cuda", "vesta-mcp/cuda"]
rocm = ["vesta-transcribe-cli/rocm", "vesta-mcp/rocm"]
sycl = ["vesta-transcribe-cli/sycl", "vesta-mcp/sycl"]
