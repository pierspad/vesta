[package]
name = "vesta-flashcards-cli"
version = "1.0.0-dev.2"
edition.workspace = true
rust-version.workspace = true
description = "Headless command-line front-end for the vesta-flashcards engine (subs → Anki TSV/APKG)."
authors = ["Pierpaolo Spadafora <pierpaolospadafora@proton.me>"]
license = "GPL-3.0-only"

[[bin]]
name = "vesta-flashcards"
path = "src/main.rs"

[dependencies]
vesta-flashcards = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
anyhow = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
