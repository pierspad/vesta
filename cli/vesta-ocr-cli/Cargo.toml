[package]
name = "vesta-ocr-cli"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Headless command-line front-end for the vesta-ocr pipeline (bitmap subtitle track extraction and OCR to SRT)."
authors = ["Pierpaolo Spadafora <pierpaolospadafora@proton.me>"]
license = "GPL-3.0-only"
repository = "https://github.com/pierspad/vesta"
readme = "README.md"

[[bin]]
name = "vesta-ocr"
path = "src/main.rs"

[dependencies]
vesta-ocr = { workspace = true }
vesta-translate = { workspace = true }
vesta-parser = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
anyhow = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
