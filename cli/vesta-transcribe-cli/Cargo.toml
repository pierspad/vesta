[package]
name = "vesta-transcribe-cli"
version = "1.0.0-dev.3"
edition.workspace = true
rust-version.workspace = true
description = "Headless command-line front-end for the vesta-transcribe pipeline (media → SRT via whisper.cpp or cloud providers)."
authors = ["Pierpaolo Spadafora <pierpaolospadafora@proton.me>"]
license = "GPL-3.0-only"

[[bin]]
name = "vesta-transcribe"
path = "src/main.rs"

[dependencies]
vesta-transcribe = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
anyhow = { workspace = true }
serde_json = { workspace = true }

[features]
vulkan = ["vesta-transcribe/vulkan"]
cuda = ["vesta-transcribe/cuda"]
rocm = ["vesta-transcribe/rocm"]
sycl = ["vesta-transcribe/sycl"]

[dev-dependencies]
tempfile.workspace = true
