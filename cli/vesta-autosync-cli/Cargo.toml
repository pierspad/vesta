[package]
name = "vesta-autosync-cli"
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Headless command-line front-end for the vesta-autosync engine (align an SRT to a media file using Whisper anchor points)."
authors = ["Pierpaolo Spadafora <pierpaolospadafora@proton.me>"]
license = "GPL-3.0-only"

[[bin]]
name = "vesta-autosync"
path = "src/main.rs"

[dependencies]
vesta-autosync = { workspace = true }
vesta-sync = { workspace = true }
vesta-transcribe = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
anyhow = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
