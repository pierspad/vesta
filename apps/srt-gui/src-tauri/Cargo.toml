[package]
name = "vesta"
version = "0.30.0"
edition.workspace = true
rust-version.workspace = true
default-run = "vesta"
description = "Video Extraction, Sync & Translation for Anki"
authors = ["Pierpaolo Spadafora <pierpaolospadafora@proton.me>"]
license = "GPL-3.0-only"

[lib]
name = "vesta_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
vesta-cli.workspace = true
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-fs = "=2.7.1"
tauri-plugin-clipboard-manager = "=2.5.0"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
urlencoding = "2"
tempfile = "3"
dirs = "6"
ffmpeg-sidecar = { version = "2.7.0", features = ["download_ffmpeg"] }
sysinfo = "0.39"
reqwest = { workspace = true }
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Dipendenze dal workspace
srt-parser = { workspace = true }
srt-extract = { workspace = true }
srt-translate = { workspace = true }
srt-sync = { workspace = true }
srt-autosync = { workspace = true }
srt-flashcards = { workspace = true }
srt-refine = { workspace = true }
srt-ankiconnect = { workspace = true }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tower = "0.5.3"
tauri-plugin-opener = "=2.7.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_6"] }
tauri-plugin-dialog = { version = "=2.8.3", default-features = false, features = ["xdg-portal"] }
# Linux desktop builds carry the portable Vulkan Whisper backend. Runtime
# selection still falls back to CPU when no usable Vulkan device is present.
srt-transcribe = { workspace = true, features = ["vulkan"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-dialog = "=2.8.3"
srt-transcribe = { workspace = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# GPU offload (Vulkan) for local Whisper transcription.
vulkan = ["srt-transcribe/vulkan"]
