[package]
name = "srt-sync"
version = "0.24.1"
edition.workspace = true
authors = ["Pierpaolo Spadafora <pierpaolospadafora@proton.me>"]
description = "Library for synchronizing SRT subtitles with video using anchor points and interpolation"
license = "GPL-3.0"
repository = "https://github.com/pierspad/vesta"
keywords = ["srt", "subtitles", "synchronization", "video"]
categories = ["multimedia"]

[dependencies]
srt-parser = { workspace = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[lib]
name = "srt_sync"
path = "src/lib.rs"
