[package]
name = "vesta-translate"
version = "1.1.1"
edition.workspace = true
rust-version.workspace = true
authors = ["Pierpaolo Spadafora <pierpaolospadafora@proton.me>"]
description = "Library for translating SRT subtitle files using LLM APIs (Gemini, OpenAI, local)"
license = "GPL-3.0-only"
repository = "https://github.com/pierspad/vesta"
keywords = ["srt", "subtitles", "translation", "llm", "ai"]
categories = ["multimedia", "localization"]

[dependencies]
vesta-parser = { workspace = true }
anyhow.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
httpdate = "1"
governor = "0.10"
tokio-util = "0.7"

[lib]
name = "vesta_translate"
path = "src/lib.rs"

[dev-dependencies]
tempfile.workspace = true
