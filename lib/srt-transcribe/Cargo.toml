[package]
name = "srt-transcribe"
version = "0.30.1"
edition.workspace = true
rust-version.workspace = true
description = "Headless local Whisper and cloud speech-to-text pipelines with cancellation and progress callbacks."
license = "GPL-3.0-only"
repository = "https://github.com/pierspad/vesta"
readme = "README.md"

[dependencies]
srt-download.workspace = true
srt-parser.workspace = true
anyhow.workspace = true
dirs.workspace = true
hound.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
whisper-rs.workspace = true
num_cpus.workspace = true
webrtc-vad = "0.4.0"
tokio-util = { version = "0.7" }
tempfile.workspace = true

[features]
# GPU offload via Vulkan (portable across AMD/Intel/NVIDIA on Linux/Windows).
# Compile-time only switch: the runtime decision stays with the caller
# (`TranscriptionConfig::use_gpu`), with automatic CPU fallback.
vulkan = ["whisper-rs/vulkan"]
# NVIDIA-only offload via CUDA/cuBLAS (needs the CUDA toolkit at build time).
cuda = ["whisper-rs/cuda"]
# AMD-only offload via ROCm/hipBLAS (Linux; needs the ROCm stack at build time).
rocm = ["whisper-rs/hipblas"]
# Intel offload via oneAPI/SYCL (Linux/Windows; needs the Intel oneAPI DPC++ compiler at build time).
sycl = ["whisper-rs/intel-sycl"]
