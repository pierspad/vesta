[package]
name = "vesta-autosync"
version = "1.0.0-dev.6"
edition.workspace = true
rust-version.workspace = true
authors = ["Pierpaolo Spadafora <pierpaolospadafora@proton.me>"]
description = "Automatic subtitle-to-audio alignment: samples audio segments, transcribes them with Whisper and suggests anchor points by fuzzy-matching against subtitle text."
license = "GPL-3.0-only"
repository = "https://github.com/pierspad/vesta"
keywords = ["srt", "subtitles", "synchronization", "whisper", "alignment"]
categories = ["multimedia"]

[lib]
name = "vesta_autosync"
path = "src/lib.rs"

[features]
default = []
vulkan = ["vesta-transcribe/vulkan", "whisper-rs/vulkan"]
cuda = ["vesta-transcribe/cuda", "whisper-rs/cuda"]
rocm = ["vesta-transcribe/rocm", "whisper-rs/hipblas"]
sycl = ["vesta-transcribe/sycl", "whisper-rs/intel-sycl"]

[dependencies]
vesta-transcribe = { workspace = true }
whisper-rs = { workspace = true }
anyhow.workspace = true
serde = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tempfile.workspace = true
