[package]
name = "vesta-ocr"
version = "1.0.0-dev.7"
edition.workspace = true
rust-version.workspace = true
authors = ["Pierpaolo Spadafora <pierpaolospadafora@proton.me>"]
description = "Headless bitmap subtitle (PGS, VobSub, DVB, XSUB) extraction and OCR pipeline."
license = "GPL-3.0-only"
repository = "https://github.com/pierspad/vesta"
readme = "README.md"
keywords = ["srt", "subtitles", "ocr", "pgs", "vobsub"]
categories = ["multimedia", "text-processing"]

[dependencies]
vesta-parser.workspace = true
vesta-download.workspace = true
vesta-extract.workspace = true
vesta-translate.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tempfile.workspace = true
dirs.workspace = true
png = "0.18"
base64 = "0.22"
tokio-util = { version = "0.7", features = ["rt"] }

[lib]
name = "vesta_ocr"
path = "src/lib.rs"
