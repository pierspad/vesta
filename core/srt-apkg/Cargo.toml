[package]
name = "srt-apkg"
version = "0.24.1"
edition.workspace = true
authors = ["Pierpaolo Spadafora <pierpaolospadafora@proton.me>"]
description = "Minimal helpers for reading and writing Anki .apkg ZIP archives."
license = "GPL-3.0-only"
repository = "https://github.com/pierspad/vesta"
keywords = ["anki", "apkg", "zip"]
categories = ["multimedia"]

[lib]
name = "srt_apkg"
path = "src/lib.rs"

[dependencies]
zip = "8"

[dev-dependencies]
tempfile.workspace = true
