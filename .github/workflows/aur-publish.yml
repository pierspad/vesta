name: Publish to AUR

on:
  # Triggered exclusively by build.yml (release job) via `gh workflow run aur-publish.yml`
  # only AFTER all release assets (including the .deb installer) have been uploaded,
  # or manually via workflow_dispatch from the Actions tab.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag whose assets were just uploaded (e.g. v1.1.1). Leave blank to publish current PKGBUILD version on main.'
        required: false
        type: string

concurrency:
  group: aur-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish-aur:
    name: Push PKGBUILD to AUR
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        # Checkout del default branch (non del tag): gli script CI (ci-push-aur.sh,
        # check_internal_crate_versions.sh) vivono qui e ricevono fix qui.
        # Il PKGBUILD sul default branch riflette sempre l'ultimo release perché
        # release.yml (semantic-release) lo aggiorna e committa prima di taggere.
        # Checkout del tag significherebbe eseguire potenzialmente una versione
        # vecchia e buggata degli script (come è successo con v0.12.0).

      - name: Normalize line endings
        shell: bash
        run: |
          sed -i 's/\r$//' build-scripts/PKGBUILD
          sed -i 's/\r$//' build-scripts/ci-push-aur.sh

      - name: Wait for active Build and Release run on main
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          PKGBUILD_VER=$(sed -n 's/^pkgver=//p' build-scripts/PKGBUILD | tr -d '\r' | xargs)
          if [ -n "$INPUT_TAG" ] && [ "v$PKGBUILD_VER" != "$INPUT_TAG" ]; then
            active_run=$(gh run list --workflow build.yml --branch main \
              --json databaseId,status --jq '[.[] | select(.status != "completed")][0].databaseId // empty' 2>/dev/null || true)
            if [ -n "$active_run" ]; then
              echo "main is already at v$PKGBUILD_VER (dispatched for $INPUT_TAG) while Build and Release #$active_run is active; deferring to #$active_run."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          for attempt in {1..3}; do
            active_run=$(gh run list --workflow build.yml --branch main \
              --json databaseId,status --jq '[.[] | select(.status != "completed")][0].databaseId // empty' 2>/dev/null || true)
            if [ -z "$active_run" ]; then
              break
            fi
            echo "Waiting for active Build and Release run #$active_run on main to finish uploading assets..."
            gh run watch "$active_run" --interval 20 || true
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Get version
        if: steps.guard.outputs.skip != 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^pkgver=//p' build-scripts/PKGBUILD | tr -d '\r' | xargs)
          if [ -z "$VERSION" ]; then
            echo "::error::pkgver non trovato in build-scripts/PKGBUILD"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versione: $VERSION"

      - name: Wait for release asset availability
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd build-scripts

          # The source= line uses shell variables (${url}, ${_srcname}, ${pkgver}),
          # so we cannot grep a literal https:// URL — we reconstruct it instead.
          PKGVER=$(grep -oP '^pkgver=\K.*' PKGBUILD | tr -d '\r' | xargs)
          BASE_URL=$(grep -oP '^url="\K[^"]+' PKGBUILD | head -n1)
          # _srcname is the upstream archive/binary name (e.g. "vesta")
          SRCNAME=$(grep -oP '^_srcname=\K\S+' PKGBUILD | head -n1)
          if [ -z "$SRCNAME" ]; then
            # fallback: use _pkgname
            SRCNAME=$(grep -oP '^_pkgname=\K\S+' PKGBUILD | head -n1)
          fi

          ASSET_URL="${BASE_URL}/releases/download/v${PKGVER}/${SRCNAME}_${PKGVER}_amd64.deb"
          echo "Verifico disponibilità: $ASSET_URL"

          for i in $(seq 1 60); do
            if curl --silent --fail --location --head "$ASSET_URL" > /dev/null; then
              echo "Asset disponibile (tentativo $i)."
              exit 0
            fi
            echo "Tentativo $i/60 fallito, riprovo in 20s..."
            sleep 20
          done
          echo "::error::Asset non disponibile dopo 20 minuti di attesa: $ASSET_URL"
          exit 1

      - name: Prepare SSH materials
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssh"

          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Il secret AUR_SSH_PRIVATE_KEY non è configurato o è vuoto!"
            exit 1
          fi

          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_aur"
          sed -i 's/\r$//' "$RUNNER_TEMP/ssh/id_aur"
          chmod 600 "$RUNNER_TEMP/ssh/id_aur"

          if [ -n "${AUR_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$AUR_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          else
            ssh-keyscan -t ed25519,rsa aur.archlinux.org > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          fi
          sed -i 's/\r$//' "$RUNNER_TEMP/ssh/known_hosts"
          chmod 644 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Write container entrypoint
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/entrypoint.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          pacman -Syu --noconfirm git sudo openssh pacman-contrib base-devel

          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

          mkdir -p /home/builder/.ssh
          cp /ssh-input/id_aur /home/builder/.ssh/id_aur
          cp /ssh-input/known_hosts /home/builder/.ssh/known_hosts

          cat > /home/builder/.ssh/config <<'SSHCONF'
          Host aur.archlinux.org
            User aur
            IdentityFile /home/builder/.ssh/id_aur
            IdentitiesOnly yes
            UserKnownHostsFile /home/builder/.ssh/known_hosts
            StrictHostKeyChecking yes
          SSHCONF

          chown -R builder:builder /home/builder/.ssh
          chmod 700 /home/builder/.ssh
          chmod 600 /home/builder/.ssh/id_aur /home/builder/.ssh/config
          chmod 644 /home/builder/.ssh/known_hosts

          exec su - builder -c /workspace/build-scripts/ci-push-aur.sh
          EOF
          chmod +x "$RUNNER_TEMP/entrypoint.sh"

      - name: Build & push AUR package
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "$RUNNER_TEMP/ssh:/ssh-input:ro" \
            -v "$RUNNER_TEMP/entrypoint.sh:/entrypoint.sh:ro" \
            archlinux:base-devel bash /entrypoint.sh
