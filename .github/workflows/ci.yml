name: CI

# build.yml gira solo su tag (release): niente lint né test ad ogni push/PR.
# Questo workflow chiude quel buco con la rete di sicurezza più economica per
# un workspace così articolato (10+ crate interni): clippy con warning come
# errori, e i test dell'intero workspace.
on:
  push:
    branches: [main, dev]
  pull_request:

env:
  TAURI_APP_DIR: apps/srt-gui
  WHISPER_DONT_GENERATE_BINDINGS: "1"
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CMAKE_C_COMPILER_LAUNCHER: "sccache"
  CMAKE_CXX_COMPILER_LAUNCHER: "sccache"

jobs:
  tauri-versions:
    name: Locked Tauri compatibility
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 build-scripts/test_release_workflows.py
      - run: python3 build-scripts/test_tauri_versions.py
      - run: python3 build-scripts/check_tauri_versions.py

  security:
    name: Dependency security advisories
    runs-on: ubuntu-22.04
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/srt-gui/package-lock.json
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "security-audit"
      - name: Install pinned advisory checker
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit locked Rust dependencies
        run: cargo audit
      - name: Audit locked frontend dependencies
        working-directory: apps/srt-gui
        run: npm audit

  # Verify embedding/CLI builds without installing GTK, WebKit, Node or a GPU SDK.
  # Selecting packages also prevents desktop Vulkan features from unifying into
  # the default CPU Whisper build used by the headless transcription CLI.
  headless:
    name: Headless engines and CLIs (CPU, no desktop)
    runs-on: ubuntu-22.04
    env:
      RUSTC_WRAPPER: ""
      CMAKE_C_COMPILER_LAUNCHER: ""
      CMAKE_CXX_COMPILER_LAUNCHER: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "headless-cpu"
      - name: Install native engine build tools and media fixtures runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold cmake ffmpeg
      - name: Test reusable engines and standalone entry points
        run: >-
          cargo test --locked --no-fail-fast
          -p srt-parser -p srt-apkg -p srt-download
          -p srt-extract -p srt-sync -p srt-translate -p srt-refine
          -p srt-flashcards -p srt-transcribe -p srt-autosync -p srt-ankiconnect
          -p srt-extract-cli -p srt-sync-cli -p srt-translate-cli
          -p srt-flashcards-cli -p srt-transcribe-cli -p srt-autosync-cli -p srt-refine-cli -p vesta-cli -p vesta-mcp
      - name: Check external consumers for every library crate
        run: python3 build-scripts/check_library_integration.py --individual

  # ===========================================================
  # Setup condiviso: dipendenze di sistema Tauri/whisper.cpp +
  # dist del frontend, richiesto da `tauri::generate_context!()`
  # (il crate `vesta` non compila senza apps/srt-gui/dist).
  # ===========================================================
  clippy:
    needs: tauri-versions
    name: Clippy (workspace, all-targets)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/srt-gui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure sccache GHA credentials
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: "v1-sccache-ci-clippy"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            cmake \
            pkg-config \
            libssl-dev \
            libclang-dev \
            mold

      # Vulkan SDK (LunarG): headers, loader e glslc, richiesti da ggml-vulkan
      # per compilare gli shader della feature `vulkan` di whisper.cpp.
      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install frontend dependencies
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm ci

      - name: Generate platform icons
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons

      - name: Build frontend assets (richiesto da generate_context!)
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm run build

      - name: cargo clippy --workspace --all-targets
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    needs: tauri-versions
    name: Test (workspace)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/srt-gui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure sccache GHA credentials
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: "v1-sccache-ci-test"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            cmake \
            pkg-config \
            libssl-dev \
            libclang-dev \
            mold \
            ffmpeg

      # Vulkan SDK (LunarG): headers, loader e glslc, richiesti da ggml-vulkan
      # per compilare gli shader della feature `vulkan` di whisper.cpp.
      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install frontend dependencies
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm ci

      - name: Generate platform icons
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons

      - name: Build frontend assets (richiesto da generate_context!)
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm run build

      - name: cargo test --workspace
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo test --locked --workspace

  # ===========================================================
  # i18n: parity, placeholder, hygiene e key usate nel sorgente.
  # Job separato e leggerissimo (solo Node, ~secondi): fallisce
  # subito senza aspettare le build Rust. Prima girava solo su
  # release (build.yml), quindi il drift arrivava su main.
  # ===========================================================
  i18n:
    name: i18n checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          # check_missing_translations.py --check-stale usa git blame
          # per confrontare le date per-key: serve la storia completa.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/srt-gui/package-lock.json

      - name: i18n consistency (parity, placeholders, hygiene)
        run: node apps/srt-gui/scripts/check-i18n.mjs

      - name: Missing translations report
        run: |
          python3 apps/srt-gui/scripts/check_missing_translations.py \
            --fail-on-issues \
            --check-stale

  # ===========================================================
  # Frontend: type-checking (svelte-check) e unit test (vitest)
  # sulle funzioni pure di lib/utils e lib/config. Anche questo
  # è solo Node — nessuna dipendenza dalle build Rust/Tauri.
  # ===========================================================
  frontend:
    name: Frontend (svelte-check + vitest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/srt-gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm ci

      - name: svelte-check
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm run check

      - name: Git hook regression tests
        run: python3 build-scripts/test_git_hooks.py

      - name: Complete localization audit
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: python3 scripts/check_missing_translations.py --fail-on-issues --output /tmp/vesta-i18n.json

      - name: Unit tests (vitest)
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm test

      - name: Cold dev CSS regression
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm run test:dev-css

      - name: Frontend production build
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm run build
