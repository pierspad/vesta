name: Release (semantic-release)

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  checks: read

jobs:
  release:
    name: Validate and Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python (audit i18n)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust stable (sync Cargo.lock)
        uses: dtolnay/rust-toolchain@stable

      - name: Normalize line endings
        shell: bash
        run: |
          sed -i 's/\r$//' build-scripts/PKGBUILD \
                           build-scripts/update_project_info.sh \
                           build-scripts/check_internal_crate_versions.sh

      - name: Validate internal crate versions
        shell: bash
        run: bash build-scripts/check_internal_crate_versions.sh

      - name: Validate i18n translations
        shell: bash
        run: |
          python3 apps/srt-gui/scripts/check_missing_translations.py \
            --output apps/srt-gui/reports/missing_translations_report.json \
            --fail-on-issues \
            --block-reasons missing_locale,missing_key,empty_value,placeholder_mismatch,same_as_english

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: apps/srt-gui
        run: npm ci

      - name: Validate frontend before release
        working-directory: apps/srt-gui
        run: |
          npm run check
          npm test
          npm run test:dev-css
          npm run build

      - name: Require successful Rust CI for this commit
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ci_run=""
          for attempt in {1..60}; do
            ci_run=$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" --event push \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$ci_run" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$ci_run" ]; then
            echo "::error::No push CI run found for $RELEASE_SHA; refusing publication."
            exit 1
          fi
          gh run watch "$ci_run" --exit-status --interval 15
          conclusion=$(gh run view "$ci_run" --json conclusion --jq '.conclusion')
          if [ "$conclusion" != success ]; then
            echo "::error::Rust CI concluded $conclusion; refusing publication."
            exit 1
          fi

      - name: Release via semantic-release
        uses: cycjimmy/semantic-release-action@v5
        id: release
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
            @cleyrop-org/semantic-release-backmerge
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
