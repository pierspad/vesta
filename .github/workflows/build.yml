name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish. Leave blank to build the selected branch and upload workflow artifacts only.'
        required: false
        type: string

env:
  TAURI_APP_DIR: apps/srt-gui
  # Release dispatches reuse the release branch cache and check out the exact tag.
  # Preview dispatches build the selected branch without publishing.
  RELEASE_REF: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  WHISPER_DONT_GENERATE_BINDINGS: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CMAKE_C_COMPILER_LAUNCHER: "sccache"
  CMAKE_CXX_COMPILER_LAUNCHER: "sccache"

jobs:
  # ===========================================================
  # Build Linux (.deb .rpm)
  # ===========================================================
  build-linux:
    name: Build (linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/srt-gui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure sccache GHA credentials
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: "v1-sccache-linux"

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^pkgver=//p' build-scripts/PKGBUILD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            cmake \
            pkg-config \
            libssl-dev \
            libclang-dev

      # Vulkan SDK (LunarG): headers, loader, and glslc required by ggml-vulkan
      # to compile shaders for whisper.cpp's `vulkan` feature.
      # At runtime libvulkan1 (declared in deb/rpm) suffices; without a GPU driver
      # whisper.cpp automatically falls back to CPU.
      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install frontend dependencies
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm ci

      - name: Normalize line endings for bash validation
        shell: bash
        run: |
          sed -i 's/\r$//' build-scripts/check_internal_crate_versions.sh
          sed -i 's/\r$//' build-scripts/PKGBUILD
          sed -i 's/\r$//' Cargo.toml

      - name: Validate internal crate versions
        shell: bash
        run: bash build-scripts/check_internal_crate_versions.sh

      - name: Validate i18n translations (missing/empty keys)
        shell: bash
        run: |
          python3 apps/srt-gui/scripts/check_missing_translations.py \
            --output apps/srt-gui/reports/missing_translations_report.json \
            --fail-on-issues

      - name: Validate i18n keys referenced in source
        shell: bash
        run: node apps/srt-gui/scripts/check-i18n.mjs

      - name: Generate platform icons
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons

      - name: Build Tauri app
        working-directory: ${{ env.TAURI_APP_DIR }}
        shell: bash
        env:
          NO_STRIP: true
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: npx tauri build --bundles deb,rpm -- --locked --features vulkan

      - name: Upload DEB
        uses: actions/upload-artifact@v6
        with:
          name: vesta-linux-deb
          path: target/release/bundle/deb/*.deb

      - name: Upload RPM
        uses: actions/upload-artifact@v6
        with:
          name: vesta-linux-rpm
          path: target/release/bundle/rpm/*.rpm

  # ===========================================================
  # Arch Linux Package (depends on core linux build)
  # ===========================================================
  build-linux-arch:
    name: Build (linux-arch)
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^pkgver=//p' build-scripts/PKGBUILD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download DEB artifact
        uses: actions/download-artifact@v7
        with:
          name: vesta-linux-deb
          path: deb-artifact

      - name: Arch Linux Package
        run: |
          DEB_FILE=$(find deb-artifact -name "*.deb" | head -n 1)
          SHA256=$(sha256sum "$DEB_FILE" | awk '{print $1}')
          LICENSE_SHA256=$(sha256sum LICENSE | awk '{print $1}')
          cp "$DEB_FILE" "build-scripts/vesta-${VERSION}.deb"

          # makepkg prohibits colons, slashes, spaces, and hyphens in pkgver:
          # sanitize semantic-release pre-releases (e.g. "0.14.0-dev.3") by replacing "-" with "."
          PKGVER="${VERSION//-/.}"

          cd build-scripts
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          LOCAL_URI="file:///workspace/build-scripts/vesta-${VERSION}.deb"
          LOCAL_LICENSE_URI="file:///workspace/LICENSE"
          # Note: in PKGBUILD the source is "${_pkgname}-${pkgver}.deb::${url}/releases/...",
          # which uses the variable ${url} rather than a literal "https://". Matching "https://"
          # here would miss the line and makepkg would attempt to download from the GitHub
          # release (which does not exist yet at this stage -> 404).
          sed -i "s|\${_pkgname}-\${pkgver}.deb::\${url}[^ \"]*|\${_pkgname}-\${pkgver}.deb::${LOCAL_URI}|" PKGBUILD
          # The prerelease tag is also not yet available on GitHub: use the license file
          # from the local checkout instead of downloading it.
          sed -i "s|LICENSE-\${pkgver}::\${url}[^ \"]*|LICENSE-\${pkgver}::${LOCAL_LICENSE_URI}|" PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('${SHA256}'|" PKGBUILD
          sed -i "/^sha256sums=/{n;s/[a-f0-9]\{64\}/${LICENSE_SHA256}/;}" PKGBUILD

          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/build-scripts archlinux:base-devel bash -c "
            pacman -Syu --noconfirm git sudo
            useradd -m builder
            chown -R builder:builder .
            echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
            su builder -c 'makepkg -sfc --noconfirm'
          "

      - name: Upload Arch Package
        uses: actions/upload-artifact@v6
        with:
          name: packages-arch
          path: build-scripts/*.pkg.tar.zst

  # ===========================================================
  # Flatpak Build (depends on core linux build)
  # ===========================================================
  build-linux-flatpak:
    name: Build (linux-flatpak)
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^pkgver=//p' build-scripts/PKGBUILD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download DEB artifact
        uses: actions/download-artifact@v7
        with:
          name: vesta-linux-deb
          path: deb-artifact

      - name: Flatpak Build
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//48 org.gnome.Sdk//48

          DEB_FILE=$(find deb-artifact -name "*.deb" | head -n 1)
          mkdir -p extracted-deb
          dpkg-deb -x "$DEB_FILE" extracted-deb

          mkdir -p build-scripts/flatpak-files
          BINARY=$(find extracted-deb/usr/bin -name "vesta" -type f -executable | head -1)
          if [ -z "$BINARY" ]; then
            BINARY=$(find extracted-deb -name "vesta" -type f -executable | head -1)
          fi
          cp "$BINARY" build-scripts/flatpak-files/vesta

          # icon.png is the 512x512 master icon generated by `tauri icon` (icon.svg)
          cp apps/srt-gui/src-tauri/icons/icon.png build-scripts/flatpak-files/com.vesta.desktop.png
          cp build-scripts/com.vesta.desktop.desktop build-scripts/flatpak-files/
          sed -i 's/^Icon=vesta/Icon=com.vesta.desktop/' build-scripts/flatpak-files/com.vesta.desktop.desktop
          sed -i 's/^StartupWMClass=vesta/StartupWMClass=com.vesta.desktop/' build-scripts/flatpak-files/com.vesta.desktop.desktop

          cd build-scripts
          flatpak-builder --force-clean --repo=repo flatpak-build com.vesta.desktop.flatpak.yml
          flatpak build-bundle repo "vesta-${VERSION}.flatpak" com.vesta.desktop

      - name: Upload Flatpak
        uses: actions/upload-artifact@v6
        with:
          name: packages-flatpak
          path: build-scripts/vesta-*.flatpak

  # ===========================================================
  # Build Windows (.exe .msi)
  # ===========================================================
  build-windows:
    name: Build (windows-${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            cache-key: v1-sccache-windows
          - arch: arm64
            target: aarch64-pc-windows-msvc
            cache-key: v1-sccache-windows-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/srt-gui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure sccache GHA credentials
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ${{ matrix.cache-key }}

      - name: Cache Tauri tools (NSIS, WiX)
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/tauri
          key: tauri-tools-windows-${{ runner.os }}-${{ matrix.arch }}-v1

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^pkgver=//p' build-scripts/PKGBUILD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Determine Windows bundle targets
        id: bundle_targets
        shell: bash
        run: |
          # WiX/MSI requires a purely numeric pre-release identifier (<= 65535):
          # "0.14.0-dev.3" is not a valid format for MSI bundles and fails the build step.
          # Pre-releases (tags with hyphens, e.g. dev branch builds) and ARM64 builds
          # generate only the NSIS installer; MSI installers are reserved for stable x64 releases.
          if [[ "$VERSION" == *-* || "${{ matrix.arch }}" == arm64 ]]; then
            echo "targets=nsis" >> "$GITHUB_OUTPUT"
          else
            echo "targets=nsis,msi" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend dependencies
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm ci

      - name: Normalize line endings for bash validation (windows)
        shell: bash
        run: |
          sed -i 's/\r$//' build-scripts/check_internal_crate_versions.sh
          sed -i 's/\r$//' build-scripts/PKGBUILD
          sed -i 's/\r$//' Cargo.toml

      - name: Validate internal crate versions
        shell: bash
        run: bash build-scripts/check_internal_crate_versions.sh

      - name: Generate platform icons
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons

      # Tauri builds the frontend via beforeBuildCommand and compiles the
      # complete Rust dependency graph, including whisper-rs-sys. Separate
      # debug cargo checks duplicate native compilation and frontend work.
      # Keep the lockfile validation in the release build itself.
      - name: Build Tauri app
        working-directory: ${{ env.TAURI_APP_DIR }}
        shell: pwsh
        env:
          NO_STRIP: true
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ steps.bundle_targets.outputs.targets }} -- --locked

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v6
        with:
          name: packages-windows-${{ matrix.arch }}-nsis
          if-no-files-found: error
          compression-level: 0
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload MSI installer
        if: ${{ steps.bundle_targets.outputs.targets == 'nsis,msi' }}
        uses: actions/upload-artifact@v6
        with:
          name: packages-windows-${{ matrix.arch }}-msi
          if-no-files-found: error
          compression-level: 0
          path: target/${{ matrix.target }}/release/bundle/msi/*.msi



  smoke-windows-arm64:
    name: Smoke test (windows-arm64)
    needs: build-windows
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages-windows-arm64-nsis
          path: installer

      - name: Install and run the native executable
        shell: pwsh
        run: |
          $installer = Get-Item installer/*-setup.exe
          $installDir = Join-Path $env:RUNNER_TEMP 'vesta-arm64-smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer failed with exit code $($install.ExitCode)"
          }

          $executable = Join-Path $installDir 'vesta.exe'
          $binary = [IO.File]::ReadAllBytes($executable)
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          if ([BitConverter]::ToUInt32($binary, $peOffset) -ne 0x4550 -or
              [BitConverter]::ToUInt16($binary, $peOffset + 4) -ne 0xaa64) {
            throw 'Expected a native ARM64 Windows executable'
          }

          $app = Start-Process -FilePath $executable -ArgumentList '--version' -PassThru
          if (-not $app.WaitForExit(30000)) {
            $app.Kill()
            throw 'The installed executable did not exit after --version'
          }
          if ($app.ExitCode -ne 0) {
            throw "The installed executable failed with exit code $($app.ExitCode)"
          }

  # ===========================================================
  # Build macOS (.dmg)
  # ===========================================================
  build-macos:
    name: Build (macos-arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/srt-gui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure sccache GHA credentials
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: v1-sccache-macos-arm64

      - name: Install frontend dependencies
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm ci

      - name: Build Tauri app
        working-directory: ${{ env.TAURI_APP_DIR }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npx tauri build --target aarch64-apple-darwin --bundles dmg -- --locked

      - name: Verify macOS disk image and app
        shell: bash
        run: |
          set -euo pipefail
          bundle=target/aarch64-apple-darwin/release/bundle
          mount_point=$(mktemp -d)
          hdiutil attach "$bundle"/dmg/*.dmg -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"; rmdir "$mount_point"' EXIT
          app=("$mount_point"/*.app)
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app[0]}/Contents/Info.plist")
          lipo -verify_arch arm64 "${app[0]}/Contents/MacOS/$executable"
          codesign --verify --deep --strict "${app[0]}"
          "${app[0]}/Contents/MacOS/$executable" --version

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v6
        with:
          name: packages-macos-arm64
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0

  # ===========================================================
  # GitHub Release
  # ===========================================================
  release:
    name: Create Release
    needs: [build-linux, build-linux-arch, build-linux-flatpak, build-windows, smoke-windows-arm64, build-macos]
    if: ${{ always() && (inputs.release_tag != '' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && needs.build-linux.result == 'success' && needs.build-linux-arch.result == 'success' && needs.build-linux-flatpak.result == 'success' && needs.build-windows.result == 'success' && needs.smoke-windows-arm64.result == 'success' && needs.build-macos.result == 'success' }}
    # Keep the current image when ubuntu-latest migrates to Ubuntu 26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Verify release tag matches source version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          PKGBUILD_VERSION=$(sed -n 's/^pkgver=//p' build-scripts/PKGBUILD | tr -d '\r' | xargs)
          if [[ "$TAG_VERSION" != "$PKGBUILD_VERSION" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match source version $PKGBUILD_VERSION."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Display artifact structure
        run: ls -R artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name "*.deb" -o -name "*.rpm" \
            -o -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \
            -o -name "*.pkg.tar.zst" -o -name "*.flatpak" \
          \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -lh release/

      - name: Prepare fallback release body
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          # The authoritative release body is generated by semantic-release
          # (@semantic-release/github) from conventional commits. This file serves
          # only as a fallback if the release does not yet exist (e.g. manual dispatch).
          TAG_SHA=$(git rev-parse HEAD)
          printf 'Release assets for %s.\n\nSource commit: https://github.com/%s/commit/%s\n' \
            "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$TAG_SHA" > release-notes-for-tag.md

      - name: Create Release and Upload Assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse HEAD)
          # Create release if missing
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Creating release..."
            PRERELEASE_FLAG=""
            if [[ "$RELEASE_TAG" == *-* ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$RELEASE_TAG" \
              --title "vesta $RELEASE_TAG" \
              --notes-file release-notes-for-tag.md \
              --target "$TAG_SHA" \
              $PRERELEASE_FLAG
          else
            echo "Release already exists."
          fi

          # Upload assets with retries for transient errors (e.g. 503)
          for i in {1..5}; do
            echo "Upload attempt $i of 5..."
            if gh release upload "$RELEASE_TAG" release/* --clobber; then
              echo "Upload completed successfully."
              if [[ "$RELEASE_TAG" != *-* ]]; then
                echo "Stable release ($RELEASE_TAG): triggering AUR publication workflow..."
                gh workflow run "Publish to AUR" --ref main || echo "::warning::Failed to trigger AUR publication workflow"
              else
                echo "Prerelease ($RELEASE_TAG): skipping AUR publication."
              fi
              exit 0
            else
              echo "Upload failed; waiting 10 seconds before retrying..."
              sleep 10
            fi
          done
          echo "Failed to upload release assets after 5 attempts."
          exit 1
