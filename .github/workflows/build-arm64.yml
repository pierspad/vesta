name: Build ARM64

on:
  # Keep push on dev while build-arm64.yml is not yet on the default branch so
  # GitHub indexes the workflow for workflow_dispatch; all jobs are dispatch-only.
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach ARM64 assets to. Leave blank for a preview build (workflow artifacts only).'
        required: false
        type: string

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  TAURI_APP_DIR: apps/srt-gui
  RELEASE_REF: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  WHISPER_DONT_GENERATE_BINDINGS: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  wait-for-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Wait for published release
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Wait for release publication
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if published=$(gh release view "$RELEASE_TAG" --json isDraft,publishedAt \
              --jq '(.isDraft | not) and (.publishedAt != null)') && [[ "$published" == true ]]; then
              exit 0
            fi
            echo "Waiting for $RELEASE_TAG to be published (attempt $attempt/30)."
            if [[ "$attempt" -lt 30 ]]; then
              sleep 10
            fi
          done
          echo "::error::Release $RELEASE_TAG was not confirmed published after 30 attempts."
          exit 1

  # ===========================================================
  # Build Windows ARM64 (.exe NSIS installer)
  # ===========================================================
  build-windows-arm64:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: wait-for-release
    name: Build (windows-arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Verify release tag matches source version
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          PKGBUILD_VERSION=$(sed -n 's/^pkgver=//p' build-scripts/PKGBUILD | tr -d '\r' | xargs)
          if [[ "$TAG_VERSION" != "$PKGBUILD_VERSION" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match source version $PKGBUILD_VERSION."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/srt-gui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure sccache GHA credentials
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: v1-sccache-windows-arm64

      - name: Cache Tauri tools (NSIS)
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/tauri
          key: tauri-tools-windows-${{ runner.os }}-arm64-v1

      - name: Ensure Ninja and clang-cl for ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ninja = Get-Command ninja.exe -ErrorAction SilentlyContinue
          if (-not $ninja) {
            $vsNinja = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($vsNinja) {
              $vsNinja.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$($vsNinja.Directory.FullName);$env:PATH"
            } else {
              choco install ninja -y --no-progress
            }
          }

          $clangCl = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          if (-not $clangCl) {
            $candidates = @()
            $vsLlvm = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm' -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending
            foreach ($dir in $vsLlvm) {
              $candidates += Join-Path $dir.FullName 'x64\bin\clang-cl.exe'
              $candidates += Join-Path $dir.FullName 'bin\clang-cl.exe'
            }
            $candidates += 'C:\Program Files\LLVM\bin\clang-cl.exe'
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($found) {
              $dir = Split-Path -Parent $found
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$dir;$env:PATH"
            } else {
              choco install llvm -y --no-progress
              'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
            }
          }

          ninja --version
          clang-cl --version

      - name: Install frontend dependencies
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm ci

      - name: Normalize line endings for bash validation (windows)
        shell: bash
        run: |
          sed -i 's/\r$//' build-scripts/check_internal_crate_versions.sh
          sed -i 's/\r$//' build-scripts/PKGBUILD
          sed -i 's/\r$//' Cargo.toml

      - name: Validate internal crate versions
        shell: bash
        run: bash build-scripts/check_internal_crate_versions.sh

      - name: Generate platform icons
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons

      - name: Build Tauri app
        working-directory: ${{ env.TAURI_APP_DIR }}
        shell: pwsh
        env:
          NO_STRIP: true
          GGML_NATIVE: "OFF"
          GGML_CCACHE: "OFF"
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: npx tauri build --target aarch64-pc-windows-msvc --bundles nsis -- --locked

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v6
        with:
          name: packages-windows-arm64-nsis
          if-no-files-found: error
          compression-level: 0
          path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

  smoke-windows-arm64:
    if: ${{ github.event_name == 'workflow_dispatch' && needs.build-windows-arm64.result == 'success' }}
    name: Smoke test (windows-arm64)
    needs: build-windows-arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages-windows-arm64-nsis
          path: installer

      - name: Install and run the native executable
        shell: pwsh
        run: |
          $installer = Get-Item installer/*-setup.exe
          $installDir = Join-Path $env:RUNNER_TEMP 'vesta-arm64-smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer failed with exit code $($install.ExitCode)"
          }

          $executable = Join-Path $installDir 'vesta.exe'
          $binary = [IO.File]::ReadAllBytes($executable)
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          if ([BitConverter]::ToUInt32($binary, $peOffset) -ne 0x4550 -or
              [BitConverter]::ToUInt16($binary, $peOffset + 4) -ne 0xaa64) {
            throw 'Expected a native ARM64 Windows executable'
          }

          $app = Start-Process -FilePath $executable -ArgumentList '--version' -PassThru
          if (-not $app.WaitForExit(30000)) {
            $app.Kill()
            throw 'The installed executable did not exit after --version'
          }
          if ($app.ExitCode -ne 0) {
            throw "The installed executable failed with exit code $($app.ExitCode)"
          }

      - name: Attach Windows ARM64 installer to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(installer/*-setup.exe)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No Windows ARM64 installer found to upload."
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG does not exist yet; refusing to attach partial asset."
            exit 1
          fi
          for i in {1..5}; do
            echo "Upload attempt $i of 5..."
            if gh release upload "$RELEASE_TAG" "${files[@]}" --clobber; then
              echo "Windows ARM64 installer attached to $RELEASE_TAG."
              exit 0
            fi
            echo "Upload failed; waiting 10 seconds before retrying..."
            sleep 10
          done
          echo "Failed to upload Windows ARM64 installer after 5 attempts."
          exit 1

  # ===========================================================
  # Build macOS ARM64 (.dmg)
  # ===========================================================
  build-macos-arm64:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: wait-for-release
    name: Build (macos-arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Verify release tag matches source version
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          PKGBUILD_VERSION=$(sed -n 's/^pkgver=//p' build-scripts/PKGBUILD | tr -d '\r' | xargs)
          if [[ "$TAG_VERSION" != "$PKGBUILD_VERSION" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match source version $PKGBUILD_VERSION."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/srt-gui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure sccache GHA credentials
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: v1-sccache-macos-arm64

      - name: Install frontend dependencies
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npm ci

      - name: Validate internal crate versions
        shell: bash
        run: bash build-scripts/check_internal_crate_versions.sh

      - name: Generate platform icons
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons

      - name: Build Tauri app
        working-directory: ${{ env.TAURI_APP_DIR }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
          GGML_NATIVE: "OFF"
        run: npx tauri build --target aarch64-apple-darwin --bundles dmg -- --locked

      - name: Verify macOS disk image and app
        shell: bash
        run: |
          set -euo pipefail
          bundle=target/aarch64-apple-darwin/release/bundle
          mount_point=$(mktemp -d)
          hdiutil attach "$bundle"/dmg/*.dmg -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"; rmdir "$mount_point"' EXIT
          app=("$mount_point"/*.app)
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app[0]}/Contents/Info.plist")
          lipo "${app[0]}/Contents/MacOS/$executable" -verify_arch arm64
          codesign --verify --deep --strict "${app[0]}"
          "${app[0]}/Contents/MacOS/$executable" --version

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v6
        with:
          name: packages-macos-arm64
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Attach macOS ARM64 disk image to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No macOS ARM64 disk image found to upload."
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG does not exist yet; refusing to attach partial asset."
            exit 1
          fi
          for i in {1..5}; do
            echo "Upload attempt $i of 5..."
            if gh release upload "$RELEASE_TAG" "${files[@]}" --clobber; then
              echo "macOS ARM64 disk image attached to $RELEASE_TAG."
              exit 0
            fi
            echo "Upload failed; waiting 10 seconds before retrying..."
            sleep 10
          done
          echo "Failed to upload macOS ARM64 disk image after 5 attempts."
          exit 1
