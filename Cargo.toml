[workspace]
resolver = "3"
members = [
    "core/*",
    "lib/*",
    "cli/*",
    "apps/vesta-gui/src-tauri",
    "apps/whisper-bench/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
dirs = "6"
hound = "3"
tempfile = "3"
same-file = "1.0.6"
whisper-rs = "0.16"
num_cpus = "1.16"
futures = "0.3"
encoding_rs = "0.8"
chardetng = "1"

# Internal crates
vesta-cli = { path = "./cli/vesta-cli", version = "0.35.0-dev.2" }
vesta-download = { path = "./core/vesta-download", version = "0.35.0-dev.2" }
vesta-parser = { path = "./core/vesta-parser", version = "0.35.0-dev.2" }
vesta-apkg = { path = "./core/vesta-apkg", version = "0.35.0-dev.2" }
vesta-extract = { path = "./lib/vesta-extract", version = "0.35.0-dev.2" }
vesta-translate = { path = "./lib/vesta-translate", version = "0.35.0-dev.2" }
vesta-sync = { path = "./lib/vesta-sync", version = "0.35.0-dev.2" }
vesta-autosync = { path = "./lib/vesta-autosync", version = "0.35.0-dev.2" }
vesta-flashcards = { path = "./lib/vesta-flashcards", version = "0.35.0-dev.2" }
vesta-refine = { path = "./lib/vesta-refine", version = "0.35.0-dev.2" }
vesta-transcribe = { path = "./lib/vesta-transcribe", version = "0.35.0-dev.2" }
vesta-ankiconnect = { path = "./lib/vesta-ankiconnect", version = "0.35.0-dev.2" }
vesta-ocr = { path = "./lib/vesta-ocr", version = "0.35.0-dev.2" }

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys-0.15.0" }
