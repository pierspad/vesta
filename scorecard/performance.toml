[[item]]
id = "PERF-001"
audit_ref = "#12.5"
area = "extract"
severity = "high"
status = "fixed"
target = "lib/vesta-ocr/src/bitmap.rs:955-1006"
summary = "Spawns a sequential ffmpeg subprocess per cue (-ss ... -i ...) for VobSub/DVB/XSUB tracks and forces scale=1280:720 (distorting non-16:9 bitmaps)."
impact = "High CPU/process-spawn overhead on multi-hundred-subtitle bitmap tracks plus geometric distortion before OCR."
fix_plan = "Batch or single-pass demux packet/subtitle timestamps and preserve original bitmap aspect ratio or PAR without hardcoded 1280:720 scaling."
verification = "Wave 3 added aspect-preserving ffprobe stream dimension probing (width/height 1..=4096), bounded parallel chunked FFmpeg cue rendering (Semaphore(2..=6) + JoinSet) with spawn_blocking PNG crop and ETXTBSY retry in lib/vesta-ocr/src/bitmap.rs, plus PGS RLE & mock parallel render unit tests verified via cargo test --locked -p vesta-ocr."

[[item]]
id = "PERF-002"
audit_ref = "#12.6"
area = "extract"
severity = "high"
status = "fixed"
target = "lib/vesta-ocr/src/local.rs:2745"
summary = "model.initializers.clone() deep-copies all ONNX model tensor weights on every line box inside run_graph()."
impact = "Repeated multi-megabyte tensor allocations and memcpy on every single OCR subtitle bounding box."
fix_plan = "Borrow &model.initializers read-only inside eval_node / run_graph instead of cloning the full initializer HashMap per inference call."
verification = "Refactored lib/vesta-ocr/src/local.rs (eval_node/run_graph) to borrow &model.initializers without per-inference HashMap cloning; verified with cargo test --locked -p vesta-ocr."

[[item]]
id = "PERF-003"
audit_ref = "#10.16"
area = "media_security"
severity = "medium"
status = "fixed"
target = "core/vesta-download/src/lib.rs:50-54"
summary = "Builds a fresh reqwest::Client on every download_to() call instead of sharing a LazyLock<reqwest::Client>."
impact = "Throws away HTTP/TLS connection pools and repeats TLS handshakes across multi-file Whisper/VAD/FFmpeg downloads."
fix_plan = "Share a LazyLock<reqwest::Client> (with timeout) in core/vesta-download."
verification = "Added shared LazyLock client with connect/read timeouts in core/vesta-download/src/lib.rs keeping download_to signature intact; verified via cargo test --locked -p vesta-download and check_doc_contracts.py."

[[item]]
id = "PERF-004"
audit_ref = "#10.17"
area = "flashcards"
severity = "medium"
status = "fixed"
target = "lib/vesta-flashcards/src/{media.rs:83-96,generation/mod.rs:108,snapshot_batch.rs:163-167,jobs.rs:110-111}"
summary = "Sync video_has_audio spawns OS thread + nested Tokio runtime; build_matched_lines & snapshot copies run sync on async workers; sequential fallback snapshots & repeated codec string clones."
impact = "Stalls Tokio worker threads during flashcard generation and increases fallback latency/allocations on batch jobs."
fix_plan = "Make video_has_audio async, wrap blocking I/O in spawn_blocking / tokio::fs, bound probe output reads, and pass &str."
verification = "Wave 2 wrapped build_matched_lines in spawn_blocking (generation/mod.rs), bounded probe reads via AsyncReadExt::take (snapshot_batch.rs), and shared Arc<str> codec strings (jobs.rs); Wave 3 converted snapshot_batch::batch() file operations to tokio::fs and bounded-parallelized fallback extract_snapshot tasks (JoinSet + Semaphore(4)) while retaining deterministic ordering and try_video_has_audio for async callers; verified via cargo test --locked -p vesta-flashcards."

[[item]]
id = "PERF-005"
audit_ref = "#12.17"
area = "extract"
severity = "medium"
status = "fixed"
target = "lib/vesta-ocr/src/hardcoded.rs:587"
summary = "analyze_roi_frame(&png_bytes) decodes PNG images and scans pixels synchronously inside the async Tokio loop."
impact = "Blocks the Tokio runtime worker thread during hardcoded-subtitle video frame scanning."
fix_plan = "Offload frame PNG decoding and pixel analysis onto spawn_blocking or dedicated worker pool."
verification = "Moved analyze_roi_frame(&png_bytes) onto tokio::task::spawn_blocking in lib/vesta-ocr/src/hardcoded.rs; verified via cargo test --locked -p vesta-ocr."

[[item]]
id = "PERF-006"
audit_ref = "#12.22"
area = "autosync"
severity = "medium"
status = "fixed"
target = "lib/vesta-autosync/src/normalization.rs:199-233"
summary = "CleanText::similarity re-allocates two Vec<char> and heap Levenshtein DP buffers per candidate in lib.rs:921 without threshold early-exit when token_score == 0.0."
impact = "Quadratic allocation pressure during large subtitle matching sweeps even when candidate max similarity < 0.40."
fix_plan = "Cache chars: Vec<char> in CleanText, early-exit below minimum similarity threshold, and reuse/stack-allocate short DP rows."
verification = "Cached private chars: Vec<char> in CleanText, added stack-allocated [usize; 128] DP buffers and similarity_with_threshold early-exit in lib/vesta-autosync/src/{normalization.rs,lib.rs}; verified via cargo test --locked -p vesta-autosync."

[[item]]
id = "PERF-007"
audit_ref = "#14.13"
area = "gui_settings_i18n"
severity = "medium"
status = "fixed"
target = "apps/vesta-gui/src/lib/panels/SubtitleListPanel.svelte:109"
